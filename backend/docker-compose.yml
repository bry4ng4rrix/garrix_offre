# =============================================================================
# Garrix Offre — stack complète
#
#   make env            # crée .env avec des secrets aléatoires (une seule fois)
#   docker compose up -d
#
# Chaque service est joignable directement sur son propre port (pas de reverse proxy) :
# API     : http://localhost:8000   (Swagger : /docs)            API_PORT
# n8n     : http://localhost:5678                                N8N_PORT
# PostgreSQL / Redis : uniquement sur 127.0.0.1                  POSTGRES_PORT / REDIS_PORT
# nginx (optionnel, désactivé) : docker compose --profile proxy up -d   NGINX_PORT
# =============================================================================
name: garrix-offre

# Configuration commune à l'API, au worker et au job de migration.
x-backend: &backend
  image: garrix-offre-api:latest
  build:
    context: .
    target: production
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    STORAGE_PATH: /app/storage
    N8N_BASE_URL: http://n8n:5678
    # L'API est exposée directement : on ne fait pas confiance à X-Forwarded-For (sinon
    # n'importe quel client pourrait choisir son IP et contourner la limite de requêtes).
    # Mettre l'IP du proxy ici si un reverse proxy est ajouté devant l'API.
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  volumes:
    - storage_data:/app/storage
  networks:
    - garrix
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - garrix
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - garrix
    restart: unless-stopped

  # Job ponctuel : applique les migrations (non destructives) + données de référence, puis s'arrête.
  migrate:
    <<: *backend
    command: ["python", "-m", "scripts.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"          # true si n8n est servi en HTTPS
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Les workflows lisent ces deux variables via {{ $env.X }}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GARRIX_API_URL: http://api:8000
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - garrix
    restart: unless-stopped

  # Reverse proxy (UML 21), OPTIONNEL : désactivé par défaut, l'API est servie directement sur
  # son port. À activer (profil "proxy") pour ajouter plus tard un domaine + HTTPS devant l'API.
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - garrix
    restart: unless-stopped

networks:
  garrix:
    name: garrix-offre-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  storage_data:
