# =============================================================================
# Surcharge de PRODUCTION (serveur public) :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#
# Chaque service écoute directement sur son propre port (pas de reverse proxy) :
# - API  : http://<serveur>:API_PORT (8000), public ;
# - n8n  : http://<serveur>:N8N_PORT (5678), sur 127.0.0.1 tant que N8N_BIND_ADDRESS n'est pas
#          mis à 0.0.0.0 dans le .env : créez d'abord le compte propriétaire de n8n (tunnel SSH),
#          sinon le premier visiteur pourrait le créer à votre place ;
# - PostgreSQL et Redis restent sur 127.0.0.1 (comme dans docker-compose.yml).
# Dans le .env du serveur : APP_ENV=production, LOG_FORMAT=json, ALLOW_REGISTRATION=false.
# =============================================================================
services:
  api:
    environment:
      API_WORKERS: ${API_WORKERS:-2}

  n8n:
    ports: !override
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      # URL publique de n8n (affichage des URL de webhook), ex. http://185.215.167.79:5678/
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
