[project]
name = "garrix-offre-backend"
version = "1.0.0"
description = "Backend FastAPI de recherche d'offres d'emploi et de gestion de candidatures"
readme = "README.md"
requires-python = ">=3.12"

# Les dépendances sont épinglées dans requirements.txt / requirements-dev.txt
# (plus simple à lire et à installer dans Docker).

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["storage", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # erreurs pycodestyle
    "W",   # avertissements pycodestyle
    "F",   # pyflakes (imports inutilisés, variables non définies...)
    "I",   # tri des imports
    "B",   # bugs probables (flake8-bugbear)
    "UP",  # syntaxe Python moderne
    "N",   # conventions de nommage
    "SIM", # simplifications
    "C4",  # compréhensions
    "S",   # sécurité (bandit)
    "BLE", # "except Exception" : doit toujours être justifié
    "RUF", # règles spécifiques à Ruff
]
ignore = [
    "E501",   # longueur de ligne gérée par Black
    "B008",   # Depends()/Query() dans les valeurs par défaut : pattern FastAPI
    "N818",   # noms d'exceptions : AppException, IdempotentReplay (choix de lisibilité)
    "RUF001", # caractères unicode ambigus : le projet contient du texte en français
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"alembic/versions/**" = ["E501", "N999"]
"scripts/seed.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
# Le dossier local "alembic/" (migrations) ne doit pas masquer le paquet alembic.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "integration: tests qui utilisent PostgreSQL et Redis",
]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/versions/", "storage/", ".venv/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
