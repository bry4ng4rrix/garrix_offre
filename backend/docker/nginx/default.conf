# Reverse proxy devant l'API FastAPI (HTTP + WebSocket).
# En production, ajoutez ici la terminaison TLS (certificats Let's Encrypt, etc.).

# DNS interne de Docker : le nom "api" est résolu à chaque requête (valid=10s).
# Sans cela, nginx garderait l'ancienne IP après un redéploiement de l'API (erreur 502).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    set $api_upstream http://api:8000;

    # Uploads : MAX_UPLOAD_SIZE_MB (10 Mo) + marge pour l'enveloppe multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/v1/ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
